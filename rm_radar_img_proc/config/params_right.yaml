radar_imgProc:
  # Detection backend: 0 = traditional armor pipeline, 1 = YOLO/OpenVINO
  detect_method: 1
  enable_target_filter: true
  model_config_path: "/home/dynamicx/rm_ws/src/rm_radarplugin/rm_radar_img_proc/config/model.yaml"

  preprocess_condition:
    # Target color: 0 = blue, 1 = red
    target_color: 1
    preprocess_method: 1

    red_h_min_low: 0
    red_h_max_low: 25
    red_h_min_high: 156
    red_h_max_high: 180
    red_s_min: 43
    red_s_max: 255
    red_v_min: 150
    red_v_max: 255

    blue_h_min: 80
    blue_h_max: 120
    blue_s_min: 30
    blue_s_max: 255
    blue_v_min: 190
    blue_v_max: 255

    binary_thresh: 76
    morph_type: 3
    binary_element: 7
    kernel_shape: 1
    kernel_w: 7
    kernel_h: 1
    kernel_angle_deg: 90
    morph_iterations: 2

  armor_condition:
    process_debug: false
    is_bar_debug: false
    is_armor_debug: false
    select_bar: 1
    enable_target_filter: true
    save_yolo_samples: false
    yolo_refine_enabled: false

    max_angle_diff: 7.0
    min_lw_ratio: 3.0
    max_lw_ratio: 9.0
    min_pixel_contained_ratio: 0.5

    max_bars_ratio: 1.5
    min_bars_distance: 0.25
    max_bars_distance: 3.0
    max_bars_angle: 5.0
    max_bars_x_dis: 0.3

    refine_max_brightness: 25.0
    refine_roi_scale: 0.07
    refine_search_start: 0.4
    refine_search_end: 0.6

  draw_condition:
    draw_type: 1
    line_width: 2
    show_fps: true
    show_centroid_only: false
    show_all_armors: false
