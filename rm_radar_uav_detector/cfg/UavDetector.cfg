PACKAGE = "rm_radar_uav_detector"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

basic_group = gen.add_group("basic", "Basic settings")
basic_group.add("debug_mode", bool_t, 0, "Enable per-step debug logs and warning-on-failure early return", False)
basic_group.add("timeout_s", double_t, 0, "Max allowed age between image and track timestamps (s)", 0.2, 0.01, 2.0)
basic_group.add("tf_timeout_s", double_t, 0, "TF lookup timeout (s)", 0.02, 0.001, 0.5)

visual_group = gen.add_group("visualization", "Visualization settings")
visual_group.add("disable", bool_t, 0, "Disable debug drawing and publishing debugimage", False)
visual_group.add("draw_bbox", bool_t, 0, "Draw projected bbox on debug image", True)
visual_group.add("draw_roi", bool_t, 0, "Draw roi rectangle on debug image", True)
visual_group.add("line_thickness", int_t, 0, "AABB line thickness", 2, 1, 10)

roi_group = gen.add_group("roi", "ROI settings")
roi_group.add("expand_ratio", double_t, 0, "ROI expand ratio around bbox (0.0 means no expansion)", 0.0, 0.0, 5.0)

pixel_bias_group = gen.add_group("pixel_bias", "Pixel bias compensation")
pixel_bias_group.add("pixel_bias_u", double_t, 0, "Projected pixel x offset (du, px)", 0.0, -500.0, 500.0)
pixel_bias_group.add("pixel_bias_v", double_t, 0, "Projected pixel y offset (dv, px)", 0.0, -500.0, 500.0)

exit(gen.generate(PACKAGE, "rm_radar_uav_detector", "UavDetector"))
