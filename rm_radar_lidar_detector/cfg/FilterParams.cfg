#!/usr/bin/env python
PACKAGE = "rm_radar_lidar_detector"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Detection mode: 0 = Dynamic , 1 = Direct 
detection_mode_enum = gen.enum([
    gen.const("Dynamic", int_t, 0, "Dynamic point detection mode (fast)"),
    gen.const("Direct", int_t, 1, "Direct detection on accumulated cloud")
], "Detection mode selection")
gen.add("detection_mode", int_t, 0, "Detection mode: 0=Dynamic, 1=Direct", 0, 0, 1, edit_method=detection_mode_enum)

# Voxel filter parameters
gen.add("voxel_leaf_size", double_t, 0, "Voxel grid filter leaf size", 0.1, 0.01, 1.0)

# PassThrough filter parameters
gen.add("pass_x_min", double_t, 0, "Pass through filter X min", 0.0, -100.0, 100.0)
gen.add("pass_x_max", double_t, 0, "Pass through filter X max", 35.0, -100.0, 100.0)
gen.add("pass_y_min", double_t, 0, "Pass through filter Y min", -10.0, -100.0, 100.0)
gen.add("pass_y_max", double_t, 0, "Pass through filter Y max", 8.0, -100.0, 100.0)
gen.add("pass_z_min", double_t, 0, "Pass through filter Z min", -50.0, -100.0, 100.0)
gen.add("pass_z_max", double_t, 0, "Pass through filter Z max", 7.0, -100.0, 100.0)

# Radius outlier removal parameters
gen.add("radius_search", double_t, 0, "Radius search for outlier removal", 0.3, 0.01, 5.0)
gen.add("min_neighbors", int_t, 0, "Minimum neighbors for outlier removal", 3, 1, 50)

# DBSCAN clustering parameters
gen.add("eps", double_t, 0, "DBSCAN epsilon (neighborhood radius)", 0.5, 0.01, 5.0)
gen.add("minPts", int_t, 0, "DBSCAN minimum points for core point", 5, 1, 100)

# Dynamic detection parameters
gen.add("distance_threshold", double_t, 0, "Distance threshold for dynamic detection", 0.3, 0.01, 5.0)
gen.add("ransac_distance_threshold", double_t, 0, "RANSAC ground removal threshold", 0.3, 0.01, 2.0)
gen.add("aircraft_min_z", double_t, 0, "Minimum Z for aircraft detection", -14.0, -50.0, 50.0)

# Cluster size filtering parameters
gen.add("max_volume", double_t, 0, "Maximum cluster volume", 10.0, 0.001, 100.0)
gen.add("min_volume", double_t, 0, "Minimum cluster volume", 0.001, 0.0001, 10.0)
gen.add("max_ratio", double_t, 0, "Maximum cluster dimension ratio", 10.0, 1.0, 100.0)
gen.add("min_ratio", double_t, 0, "Minimum cluster dimension ratio", 1.0, 0.1, 10.0)

# Expansion parameters
gen.add("expansion_m", double_t, 0, "AABB expansion margin in meters", 1.0, 0.0, 5.0)

exit(gen.generate(PACKAGE, "rm_radar_lidar_detector", "FilterParams"))
