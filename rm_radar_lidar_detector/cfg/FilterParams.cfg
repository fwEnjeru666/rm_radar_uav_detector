#!/usr/bin/env python
PACKAGE = "rm_radar_lidar_detector"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Detection mode: 0 = Dynamic , 1 = Direct 
detection_mode_enum = gen.enum([
    gen.const("Dynamic", int_t, 0, "Dynamic point detection mode (fast)"),
    gen.const("Direct", int_t, 1, "Direct detection on accumulated cloud")
], "Detection mode selection")
gen.add("detection_mode", int_t, 0, "Detection mode: 0=Dynamic, 1=Direct", 0, 0, 1, edit_method=detection_mode_enum)

# Frame Accumulation Group
accumulation_group = gen.add_group("FrameAccumulation")
accumulation_group.add("cloud_queue_size", int_t, 0, "Number of preprocessed frames kept for accumulated-cloud detection", 10, 1, 100)
accumulation_group.add("drone_aabb_accumulation_max_points", int_t, 0, "Maximum points kept in drone AABB accumulation", 3000, 100, 50000)
accumulation_group.add("drone_aabb_accumulation_reset_distance", double_t, 0, "Reset drone AABB accumulation when detected center moves farther than this distance in meters; 0 disables", 0.25, 0.0, 5.0)
accumulation_group.add("target_front_view_accumulation_frames", int_t, 0, "Number of target front-view frames accumulated before each OpenCV tracking update", 1, 1, 60)

# Target Cloud Group
output_cloud_group = gen.add_group("TargetCloud")
output_cloud_group.add("publish_raw_drone_cloud", bool_t, 0, "Publish drone_cloud by cropping original Livox cloud with detected AABB", True)
output_cloud_group.add("target_cloud_min_support_points", int_t, 0, "Minimum local support points for target-cloud extraction", 3, 2, 100)
output_cloud_group.add("target_cloud_height_window", double_t, 0, "Vertical window below the highest supported target seed used for stable target-cloud extraction", 0.2, 0.02, 2.0)
output_cloud_group.add("target_point_smoothing_alpha", double_t, 0, "Low-pass alpha for published selected target point", 1.0, 0.0, 1.0)
output_cloud_group.add("target_point_max_jump_distance", double_t, 0, "Reject selected target point jumps larger than this distance in meters; 0 disables", 0.8, 0.0, 5.0)
output_cloud_group.add("target_template_update_min_score", double_t, 0, "Update selected 2D target template only when patch matching score is at least this value", 0.75, 0.0, 1.0)
output_cloud_group.add("target_template_learning_rate", double_t, 0, "EMA learning rate for online selected 2D target template training", 0.10, 0.0, 1.0)
output_cloud_group.add("target_template_train_threshold", double_t, 0, "Occupancy probability threshold used to binarize the trained 2D target template", 0.45, 0.0, 1.0)
output_cloud_group.add("target_template_train_min_points", int_t, 0, "Minimum occupied points required after online 2D target template training", 3, 1, 2000)

# Voxel Filter Group
voxel_group = gen.add_group("VoxelFilter")
voxel_group.add("enable_voxel_downsample", bool_t, 0, "Enable voxel grid downsampling", True)
voxel_group.add("voxel_leaf_size", double_t, 0, "Voxel grid filter leaf size", 0.1, 0.01, 1.0)

# PassThrough Filter Group
passthrough_group = gen.add_group("PassThroughFilter")
passthrough_group.add("pass_x_min", double_t, 0, "Pass through filter X min", 0.0, -500.0, 500.0)
passthrough_group.add("pass_x_max", double_t, 0, "Pass through filter X max", 35.0, -500.0, 500.0)
passthrough_group.add("pass_y_min", double_t, 0, "Pass through filter Y min", -10.0, -500.0, 500.0)
passthrough_group.add("pass_y_max", double_t, 0, "Pass through filter Y max", 8.0, -500.0, 500.0)
passthrough_group.add("pass_z_min", double_t, 0, "Pass through filter Z min", -50.0, -500.0, 500.0)
passthrough_group.add("pass_z_max", double_t, 0, "Pass through filter Z max", 7.0, -500.0, 500.0)

# Radius Outlier Removal Group
radius_outlier_group = gen.add_group("RadiusOutlierRemoval")
radius_outlier_group.add("radius_search", double_t, 0, "Radius search for outlier removal", 0.3, 0.01, 5.0)
radius_outlier_group.add("min_neighbors", int_t, 0, "Minimum neighbors for outlier removal", 3, 1, 50)

# DBSCAN Clustering Group
dbscan_group = gen.add_group("DBSCANClustering")
dbscan_group.add("eps", double_t, 0, "DBSCAN epsilon (neighborhood radius)", 0.5, 0.01, 5.0)
dbscan_group.add("minPts", int_t, 0, "DBSCAN minimum points for core point", 5, 1, 300)

# Dynamic Detection Group
dynamic_detection_group = gen.add_group("DynamicDetection")
dynamic_detection_group.add("distance_threshold", double_t, 0, "Distance threshold for dynamic detection", 0.3, 0.01, 5.0)
dynamic_detection_group.add("aircraft_min_z", double_t, 0, "Minimum Z for aircraft detection", -14.0, -50.0, 50.0)

# Plane Removal (unified arbitrary-plane stripping)
plane_group = gen.add_group("PlaneRemoval")
plane_group.add("remove_planes", bool_t, 0, "Enable unified plane removal", True)
plane_group.add("plane_distance_threshold", double_t, 0, "RANSAC distance threshold for plane inliers", 0.3, 0.01, 2.0)
plane_group.add("plane_min_points", int_t, 0, "Minimum inlier points to accept a plane", 120, 30, 20000)
plane_group.add("plane_min_inlier_ratio", double_t, 0, "Minimum inlier ratio to accept a plane", 0.08, 0.0, 1.0)
plane_group.add("plane_max_planes", int_t, 0, "Maximum number of planes removed per frame", 3, 1, 20)
plane_group.add("plane_max_iterations", int_t, 0, "RANSAC max iterations per plane", 120, 20, 500)
plane_group.add("plane_fail_streak_threshold", int_t, 0, "Failed frames before cooldown", 2, 1, 50)
plane_group.add("plane_fail_cooldown_frames", int_t, 0, "Cooldown frames after repeated failures", 20, 0, 500)
# Cluster Filter Group
cluster_filter_group = gen.add_group("ClusterFilter")
cluster_filter_group.add("min_n", int_t, 0, "Minimum n (point count)", 5, 1, 20000)
cluster_filter_group.add("max_n", int_t, 0, "Maximum n (point count)", 5000, 1, 200000)
cluster_filter_group.add("min_v", double_t, 0, "Minimum v (volume)", 0.001, 0.0001, 10.0)
cluster_filter_group.add("max_v", double_t, 0, "Maximum v (volume)", 10.0, 0.001, 100.0)
cluster_filter_group.add("min_r", double_t, 0, "Minimum r (ratio)", 1.0, 0.1, 10.0)
cluster_filter_group.add("max_r", double_t, 0, "Maximum r (ratio)", 10.0, 1.0, 100.0)
cluster_filter_group.add("min_pca_r", double_t, 0, "Minimum pca ratio", 1.0, 0.1, 30.0)
cluster_filter_group.add("max_pca_r", double_t, 0, "Maximum pca ratio", 10.0, 1.0, 100.0)
cluster_filter_group.add("min_h", double_t, 0, "Minimum h (center height)", -3.0, -50.0, 50.0)
cluster_filter_group.add("max_h", double_t, 0, "Maximum h (center height)", 10.0, -50.0, 100.0)

# Bounding Box Expansion Group
expansion_group = gen.add_group("BoundingBoxExpansion")
expansion_group.add("publish_plane_debug_clouds", bool_t, 0, "Publish removed ground/wall debug clouds", True)

# Debug Group
debug_group = gen.add_group("Debug")
debug_group.add("verbose_log", bool_t, 0, "Enable verbose runtime logs", False)
debug_group.add("publish_track_text", bool_t, 0, "Publish tracked-target speed text", True)
debug_group.add("publish_track_target_marker", bool_t, 0, "Publish dedicated tracked-target marker", True)
debug_group.add("publish_track_trajectory", bool_t, 0, "Publish tracked-target trajectory line", True)
debug_group.add("selected_target_point_marker_scale", double_t, 0, "Selected target point marker scale in RViz", 0.01, 0.001, 0.5)

# Consistency Scoring Group (main tuning knobs)
consistency_group = gen.add_group("ConsistencyScoring")
consistency_group.add("confidence_on", double_t, 0, "Lock-on confidence threshold", 0.68, 0.0, 1.0)
consistency_group.add("confidence_keep", double_t, 0, "Track-keep confidence threshold", 0.52, 0.0, 1.0)
consistency_group.add("lock_min_streak", int_t, 0, "Minimum consecutive frames to lock", 3, 1, 20)
consistency_group.add("gate_pos_base", double_t, 0, "Base association gate (m)", 0.6, 0.05, 5.0)
consistency_group.add("gate_pos_range_k", double_t, 0, "Range gain for association gate", 0.03, 0.0, 0.2)

# Single-Target Tracker Group
track_group = gen.add_group("Tracker")
track_group.add("track_enable", bool_t, 0, "Enable internal LiDAR single-target tracker", True)
track_group.add("track_local_cluster_enable", bool_t, 0, "Enable local re-clustering around the current tracker position before global detection", True)
track_group.add("track_gate_distance_m", double_t, 0, "Measurement gate distance for tracker update (m)", 1.5, 0.05, 20.0)
track_group.add("track_max_lost_time_s", double_t, 0, "Max lost time before tracker enters not-tracking", 0.8, 0.05, 5.0)
track_group.add("track_pos_alpha", double_t, 0, "Position EMA factor [0,1]", 0.65, 0.0, 1.0)
track_group.add("track_vel_alpha", double_t, 0, "Velocity EMA factor [0,1]", 0.45, 0.0, 1.0)
track_group.add("track_max_speed_mps", double_t, 0, "Tracker speed cap (m/s)", 15.0, 0.5, 100.0)
track_group.add("track_velocity_min_dt_s", double_t, 0, "Min dt for velocity/accel update (s)", 0.03, 0.005, 0.2)
track_group.add("track_predict_max_dt_s", double_t, 0, "Max dt per predict step to avoid jump (s)", 0.08, 0.005, 0.5)
track_group.add("track_miss_velocity_decay", double_t, 0, "Velocity decay on miss frame [0,1]", 0.85, 0.0, 1.0)

exit(gen.generate(PACKAGE, "rm_radar_lidar_detector", "FilterParams"))
