# LiDAR Detector 参数配置文件 (标准YAML格式)
# 保存参数: rosparam dump $(rospack find rm_radar_lidar_detector)/cfg/default_params.yaml /lidar_detector
# 加载参数: rosparam load $(rospack find rm_radar_lidar_detector)/cfg/default_params.yaml /lidar_detector

accumulated_publish_divider: 2
aircraft_min_z: -3.0
cloud_queue_size: 10
cloud_topic: /livox/lidar
confidence_keep: 0.52
confidence_on: 0.70
detection_mode: 1
distance_threshold: 0.3992
drone_aabb_accumulation_max_points: 3000
drone_aabb_accumulation_reset_distance: 0.25
enable_voxel_downsample: true
eps: 0.5
extract_target_from_input_cloud: false
frame_id: livox_frame
gate_pos_base: 0.6
gate_pos_range_k: 0.03
lock_min_streak: 3
max_h: 5.0
max_n: 500
max_pca_r: 5.0
max_r: 3.0
max_ratio: 12.87
max_v: 3.0
max_volume: 10.0
minPts: 5
min_h: 1.0
min_n: 100
min_neighbors: 10
min_pca_r: 1.0
min_r: 1.0
min_v: 1.0
pass_x_max: 35.0
pass_x_min: -20.0
pass_y_max: -3.0
pass_y_min: -7.0
pass_z_max: 10.0
pass_z_min: -30.0
plane_distance_threshold: 1.0
plane_fail_cooldown_frames: 10
plane_fail_streak_threshold: 3
plane_max_iterations: 120
plane_max_planes: 3
plane_min_inlier_ratio: 0.08
plane_min_points: 400
project_input_cloud_directly: false
publish_cluster_debug_markers: true
publish_plane_debug_clouds: true
publish_raw_drone_cloud: true
publish_track_target_marker: true
publish_track_text: true
publish_track_trajectory: true
radius_search: 0.5
remove_planes: true
selected_target_point_marker_scale: 0.01
show_target_front_view: true
target_cloud_height_window: 0.2
target_cloud_min_support_points: 3
target_front_view_accumulation_frames: 1
target_front_view_adaptive_resolution: false
target_front_view_max_image_size: 700
target_front_view_max_resolution: 0.01
target_front_view_min_points: 3
target_front_view_resolution: 0.001
target_front_view_resolution_scale: 1.5
target_point_max_jump_distance: 0.8
target_point_smoothing_alpha: 1.0
target_template_learning_rate: 0.1
target_template_train_min_points: 3
target_template_train_threshold: 0.45
target_template_update_min_score: 0.75
track_enable: true
track_local_cluster_enable: true
track_gate_distance_m: 1.5
track_max_lost_time_s: 0.3
track_max_speed_mps: 15.0
track_miss_velocity_decay: 0.85
track_pos_alpha: 0.65
track_predict_max_dt_s: 0.08
track_vel_alpha: 0.45
track_velocity_min_dt_s: 0.03
verbose_log: false
voxel_leaf_size: 0.1
