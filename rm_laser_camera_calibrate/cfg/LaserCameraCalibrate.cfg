PACKAGE = "rm_laser_camera_calibrate"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

runtime = gen.add_group("Runtime")
runtime.add("enable", bool_t, 0, "Enable laser-camera calibrator", False)
runtime.add("enable_sampling", bool_t, 0, "Allow manual sampling and CSV recording", False)
runtime.add("h_px_min", double_t, 0, "Minimum armor height for valid sampling", 4.0, 0.1, 10000.0)
runtime.add("h_px_max", double_t, 0, "Maximum armor height for valid sampling", 300.0, 0.1, 10000.0)
runtime.add("min_sample_interval", double_t, 0, "Minimum interval between samples (s)", 0.05, 0.0, 10.0)
runtime.add("min_h_gap_px", double_t, 0, "Minimum h_px gap between consecutive samples", 2.0, 0.0, 200.0)
runtime.add("enforce_h_bin_sampling", bool_t, 0, "Limit sample count in each h_px bin", True)
runtime.add("h_bin_size_px", double_t, 0, "h_px bin size for balanced sampling", 6.0, 0.1, 500.0)
runtime.add("max_samples_per_h_bin", int_t, 0, "Maximum samples allowed per bin", 60, 1, 1000)
runtime.add("min_fit_samples", int_t, 0, "Minimum sample count to mark fit as ready", 30, 3, 10000)
runtime.add("min_fit_groups", int_t, 0, "Minimum populated h bins to mark fit as ready", 8, 1, 1000)
runtime.add("max_fit_rmse_x", double_t, 0, "Maximum fit RMSE on x (px)", 2.5, 0.01, 100.0)
runtime.add("max_fit_rmse_y", double_t, 0, "Maximum fit RMSE on y (px)", 2.5, 0.01, 100.0)
runtime.add("flush_each_sample", bool_t, 0, "Flush CSV to disk after each accepted sample", False)

exit(gen.generate(PACKAGE, "rm_laser_camera_calibrate", "LaserCameraCalibrate"))
