#!/usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Maneuver Detection Group
maneuver_group = gen.add_group("ManeuverDetection")
maneuver_group.add("lambda_ema_alpha", double_t, 0, "EMA alpha for maneuver indicator lambda", 0.3, 0.01, 1.0)
maneuver_group.add("nis_baseline_alpha", double_t, 0, "EMA alpha for NIS baseline", 0.01, 0.001, 1.0)

# TPM Adaptation Group
tpm_group = gen.add_group("TPMAdaptation")
tpm_group.add("sigmoid_k", double_t, 0, "Sigmoid steepness for TPM adaptation", 2.0, 0.1, 10.0)
tpm_group.add("maneuver_gain", double_t, 0, "Additional gain for TPM adaptation", 1.0, 0.1, 10.0)
tpm_group.add("p_stay_min", double_t, 0, "Min P(stay) during maneuvers", 0.60, 0.1, 0.99)
tpm_group.add("p_stay_max", double_t, 0, "Max P(stay) during smooth motion", 0.98, 0.1, 0.99)
tpm_group.add("p_stay_nominal", double_t, 0, "Nominal P(stay)", 0.90, 0.1, 0.99)

# Process Noise Adaptation Group
noise_group = gen.add_group("ProcessNoiseAdaptation")
noise_group.add("q_scale_max", double_t, 0, "Max process noise scale factor", 10.0, 1.0, 150.0)

exit(gen.generate("rm_track", "rm_track", "aimm"))