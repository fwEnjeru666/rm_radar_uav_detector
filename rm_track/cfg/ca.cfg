#!/usr/bin/env python
# -*- coding: utf-8 -*-

PACKAGE = "rm_radarplugin"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Position Noise Group
pos_group = gen.add_group("PositionNoise")
pos_group.add("q_x", double_t, 0, "Process noise for X position", 0.1, 0.001, 10.0)
pos_group.add("q_y", double_t, 0, "Process noise for Y position", 0.1, 0.001, 10.0)
pos_group.add("q_z", double_t, 0, "Process noise for Z position", 0.1, 0.001, 10.0)

# Velocity Noise Group
vel_group = gen.add_group("VelocityNoise")
vel_group.add("q_vx", double_t, 0, "Process noise for X velocity", 0.5, 0.001, 50.0)
vel_group.add("q_vy", double_t, 0, "Process noise for Y velocity", 0.5, 0.001, 50.0)
vel_group.add("q_vz", double_t, 0, "Process noise for Z velocity", 0.5, 0.001, 50.0)

# Acceleration Noise Group
accel_group = gen.add_group("AccelerationNoise")
accel_group.add("q_ax", double_t, 0, "Process noise for AX", 1.0, 0.001, 100.0)
accel_group.add("q_ay", double_t, 0, "Process noise for AY", 1.0, 0.001, 100.0)
accel_group.add("q_az", double_t, 0, "Process noise for AZ", 0.5, 0.001, 50.0)

exit(gen.generate(PACKAGE, "rm_radarplugin", "ca"))