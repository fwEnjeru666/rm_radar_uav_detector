PACKAGE = "rm_track"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Basic settings
gen.add("debug_mode", bool_t, 0, "Enable debug info", False)
gen.add("state_log_mode", bool_t, 0, "Enable tracker state-machine logs", True)
gen.add("hit_threshold", int_t, 0, "Number of hits to confirm a track", 3, 1, 10)
gen.add("max_lost_count", int_t, 0, "Number of misses to delete a track", 5, 1, 20)
gen.add("cam_hitcount", int_t, 0, "Consecutive CAM hits to confirm a track", 3, 1, 50)
gen.add("cam_lostcount", int_t, 0, "Consecutive CAM misses before LOST", 5, 1, 200)
gen.add("lidar_hitcount", int_t, 0, "Consecutive LiDAR hits to confirm a track", 3, 1, 50)
gen.add("lidar_lostcount", int_t, 0, "Consecutive LiDAR misses before LOST", 5, 1, 200)
gen.add("force_3d_measurement", bool_t, 0, "Force pure 3D measurement (disable 8D corner measurement)", False)
gen.add("enable_pixel_gating", bool_t, 0, "Enable pixel-space innovation gating", False)
gen.add("enable_3d_fallback", bool_t, 0, "Allow fallback to 3D when 8D is unavailable or gated out", False)
gen.add("pixel_nis_gate", double_t, 0, "Pixel measurement NIS gate", 40.0, 1.0, 500.0)
gen.add("pixel_reproj_rmse_gate_near", double_t, 0, "Near-range reprojection RMSE gate", 12.0, 1.0, 200.0)
gen.add("pixel_reproj_rmse_gate_mid", double_t, 0, "Mid-range reprojection RMSE gate", 20.0, 1.0, 300.0)
gen.add("pixel_reproj_rmse_gate_far", double_t, 0, "Far-range reprojection RMSE gate", 30.0, 1.0, 500.0)
gen.add("pixel_gate_distance_near", double_t, 0, "Near-range distance threshold", 8.0, 0.1, 100.0)
gen.add("pixel_gate_distance_far", double_t, 0, "Far-range distance threshold", 18.0, 0.1, 200.0)

# Estimator type selection
gen.add("use_aimm", bool_t, 0, "Use AIMM estimator instead of Pure UKF", False)

# AIMM Group
aimm_group = gen.add_group("AIMM")
aimm_group.add("aimm_debug_mode", bool_t, 0, "Enable AIMM debug info", False)

# Pure UKF Group
ukf_group = gen.add_group("PureUKF")
model_enum = gen.enum([ gen.const("CV", int_t, 0, "Constant Velocity"),
                        gen.const("CA", int_t, 1, "Constant Acceleration"),
                        gen.const("CTRV", int_t, 2, "Constant Turn Rate and Velocity"),
                        gen.const("SINGER", int_t, 3, "Singer acceleration model")],
                      "An enum to set the pure UKF model")
ukf_group.add("pure_ukf_model_type", int_t, 0, "Model for Pure UKF mode", 3, 0, 3, edit_method=model_enum)

# Measurement Noise Group
r_group_p = gen.add_group("MeasurementPixelNoise")
r_group_p.add("tele_pixel_noise_u", double_t, 0, "Telecam pixel noise sigma for u", 4.0, 0.1, 100.0)
r_group_p.add("tele_pixel_noise_v", double_t, 0, "Telecam pixel noise sigma for v", 4.0, 0.1, 100.0)
r_group_p.add("wide_pixel_noise_u", double_t, 0, "Widecam pixel noise sigma for u", 4.0, 0.1, 100.0)
r_group_p.add("wide_pixel_noise_v", double_t, 0, "Widecam pixel noise sigma for v", 4.0, 0.1, 100.0)
r_group_t = gen.add_group("MeasurementNoiseForTeleCamera")
r_group_t.add("tele_r_pos_xy", double_t, 0, "Measurement noise for position XY", 0.001, 0.0001, 1.0)
r_group_t.add("tele_r_pos_z",  double_t, 0, "Measurement noise for position Z",  0.5, 0.0001, 1.0)
r_group_t.add("tele_r_yaw", double_t, 0, "R matrix yaw std", 0.01, 0.0001, 1.0)
r_group_w = gen.add_group("MeasurementNoiseForWideCamera")
r_group_w.add("wide_r_pos_xy", double_t, 0, "Measurement noise for position XY", 0.001, 0.0001, 1.0)
r_group_w.add("wide_r_pos_z",  double_t, 0, "Measurement noise for position Z",  0.5, 0.0001, 1.0)
r_group_w.add("wide_r_yaw", double_t, 0, "R matrix yaw std", 0.01, 0.0001, 1.0)
r_group_l = gen.add_group("MeasurementNoiseForLidar")
r_group_l.add("lidar_r_pos_xy", double_t, 0, "Measurement noise for position XY", 0.001, 0.0001, 1.0)
r_group_l.add("lidar_r_pos_z",  double_t, 0, "Measurement noise for position Z",  0.5, 0.0001, 1.0)
r_group_l.add("lidar_r_yaw", double_t, 0, "R matrix yaw std", 0.01, 0.0001, 1.0)

exit(gen.generate(PACKAGE, "rm_track", "track"))