PACKAGE = "rm_track"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("use_ema", bool_t, 0, "Enable EMA smoothing and spike rejection", False)
gen.add("verbose_log", bool_t, 0, "Enable verbose logging for detections and pose solving", True)

# EMA Smoothing Group
ema_group = gen.add_group("EMASmoothing")
ema_group.add("ema_alpha", double_t, 0, "EMA alpha (0=more smoothing, 1=no smoothing)", 0.3, 0.0, 1.0)
ema_group.add("spike_threshold", double_t, 0, "Spike rejection threshold in meters", 0.5, 0.0, 5.0)
ema_group.add("max_consecutive_spikes", int_t, 0, "Consecutive spikes before resetting EMA", 5, 1, 30)

exit(gen.generate(PACKAGE, "rm_track", "pose_solver"))