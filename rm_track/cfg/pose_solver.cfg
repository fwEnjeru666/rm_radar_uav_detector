PACKAGE = "rm_track"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("use_ema", bool_t, 0, "Enable EMA smoothing and spike rejection in PoseSolver", False)

gen.add("ema_alpha", double_t, 0, "EMA alpha (0=more smoothing, 1=no smoothing)", 0.3, 0.0, 1.0)

gen.add("spike_threshold", double_t, 0, "Spike rejection threshold in meters", 0.5, 0.0, 5.0)

gen.add("max_consecutive_spikes", int_t, 0, "Consecutive spikes before resetting EMA", 5, 1, 30)

exit(gen.generate(PACKAGE, "rm_track", "pose_solver"))
