PACKAGE = "rm_track"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

#models
model_type = gen.enum([gen.const("CTRV", int_t, 0, "Constant Turn Rate and Velocity"),
                       gen.const("CV", int_t, 1, "Constant Velocity"),  
                       gen.const("CA", int_t, 2, "Constant Acceleration")]
                       ,"type"
                       )
gen.add("model_type", int_t, 0, "Type of motion model", 1, 0, 2, edit_method=model_type)

#Q matrix
# liner
gen.add("q_pos", double_t, 0, "Process noise for position", 0.1, 0.0001, 1.0)
gen.add("q_vel_xy", double_t, 0, "liner:Q matrix xy-velocity std", 0.01, 0.0, 1.0)
gen.add("q_vel_z", double_t, 0, "liner:Q matrix z-velocity std", 0.01, 0.0, 1.0)
gen.add("q_acc_xy", double_t, 0, "liner:Q matrix xy-acceleration std", 0.05, 0.0, 1.0)
gen.add("q_acc_z", double_t, 0, "liner:Q matrix z-acceleration std", 0.05, 0.0, 1.0)

# angular for yaw and vel yaw
gen.add("q_yaw", double_t, 0, "angular:Q matrix yaw std", 0.05, 0.0, 1.0)
gen.add("q_vyaw", double_t, 0, "angular:Q matrix yaw rate std", 0.5, 0.0, 1.0)
#structural
gen.add("q_r", double_t, 0, "structural:Q matrix radius noise std", 0.01, 0.0, 1.0)
gen.add("q_dz", double_t, 0, "structural:Q matrix height noise std", 0.01, 0.0, 1.0)

#R matrix
gen.add("r_pos_xy", double_t, 0, "Measurement noise for position XY", 0.01, 0.001, 1.0)
gen.add("r_pos_z",  double_t, 0, "Measurement noise for position Z",  0.3, 0.001, 1.0)
gen.add("r_yaw", double_t, 0, "R matrix yaw std", 0.1, 0.0, 1.0)

#lambda
# gen.add("lambda", double_t, 0, "UKF lambda", 3.0, -10.0, 10.0)

#debugger
gen.add("debug_mode", bool_t, 0, "enable debug info", False)



exit(gen.generate(PACKAGE, "rm_track", "ukf"))
